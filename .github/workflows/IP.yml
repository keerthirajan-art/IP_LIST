name: Sync Repository IP List to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'IP_LIST/IPLIST' # Triggers only when your IP file changes
  workflow_dispatch:

jobs:
  sync-ips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync IP List to Cloudflare
        uses: rezzell/cloudflare-ip-list-sync-action@main
        with:
          file-path: 'IP_LIST/IPLIST' # Path to the file inside your repo
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-list-id: ${{ secrets.CLOUDFLARE_GITHUB_HOOKS_LIST_ID }}
          sources: '[{ "type": "url", "url": "https://raw.githubusercontent.com/keerthirajan-art/IP_LIST/refs/heads/main/IPLIST" }]'
